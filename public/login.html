<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NetherPanel - Login</title>
  <meta name="theme-color" content="#030305">
  <script>try{var t=localStorage.getItem('netherpanel_theme');if(t&&t!=='jtg')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="css/style.css?v=9">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="auth-page">
  <div class="panel-grid-bg"></div>
  <div class="panel-grain"></div>
  <div class="auth-bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div class="auth-card">
    <div class="auth-logo">
      <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M24 4L4 14V34L24 44L44 34V14L24 4Z" stroke="url(#lg)" stroke-width="2" fill="none"/>
        <path d="M24 12L12 18V30L24 36L36 30V18L24 12Z" fill="url(#lg)" opacity="0.3"/>
        <path d="M24 18L18 21V27L24 30L30 27V21L24 18Z" fill="url(#lg)"/>
        <defs><linearGradient id="lg" x1="4" y1="4" x2="44" y2="44"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs>
      </svg>
      <h1>NetherPanel</h1>
      <p>Minecraft Server Management</p>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login">Sign In</button>
      <button class="auth-tab" data-tab="register">Create Account</button>
    </div>

    <form id="login-form" class="auth-form active">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="login-email" class="form-input" placeholder="Enter username" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-password" class="form-input" placeholder="Enter password" required>
      </div>
      <button type="submit" class="btn-primary" style="margin-top:0.5rem">Sign In</button>
    </form>

    <form id="register-form" class="auth-form">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="reg-username" class="form-input" placeholder="Choose a username" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="reg-email" class="form-input" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="reg-password" class="form-input" placeholder="Min 8 characters" required minlength="8">
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" id="reg-password-confirm" class="form-input" placeholder="Repeat password" required>
      </div>
      <button type="submit" class="btn-primary" style="margin-top:0.5rem">Create Account</button>
    </form>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script src="js/auth.js"></script>
</body>
</html>
